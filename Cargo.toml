[workspace]
members = ["crates/rooster-core", "crates/rooster-cli", "apps/desktop/src-tauri"]
default-members = ["crates/rooster-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
ctrlc = "3.5.2"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.4"
serde-saphyr = { version = "1.2.0", default-features = false, features = ["deserialize"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
percent-encoding = "2.3.2"
libc = "0.2.189"
ureq = { version = "2.12.1", default-features = false, features = ["tls", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
